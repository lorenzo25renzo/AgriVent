
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AgriVent</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-brand">
            <h2>AgriVent</h2>
            <p>Sales & Inventory Analytics</p>
        </div>

        <div class="login-card">
            <h4>Welcome Back!</h4>
            <p class="login-subtitle">Please sign in to your account.</p>

            
            {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
            {% endif %}


            <form action="/login" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username"
                           name="username" placeholder="Enter your username" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password"
                           name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn login-button w-100">
                    Sign In
                </button>
            </form>

            <p class="login-footer">
                Agricultural Supply Sales and Inventory Analytics System
            </p>
        </div>
    </div>

</body>
</html>
